<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manim-Web Live Editor</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1e1e1e;
            color: white;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        #toolbar {
            height: 35px;
            background-color: #2c2c2c;
            border-bottom: 1px solid #3c3c3c;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 4px;
        }
        #main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        #editor-container {
            width: 50%;
            height: 100%;
            min-width: 100px;
            overflow: hidden;
        }
        #editor-container.animate-width {
            transition: width 0.3s ease-in-out;
        }
        #editor-container.collapsed {
            width: 0 !important;
            min-width: 0 !important;
        }
        #resizer {
            width: 4px;
            cursor: col-resize;
            background-color: #252526;
            transition: background-color 0.2s;
            z-index: 10;
        }
        #resizer.animate-opacity {
            transition: background-color 0.2s, opacity 0.3s ease-in-out;
        }
        #resizer.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #resizer:hover, #resizer.dragging {
            background-color: #007fd4;
        }
        #render-container {
            flex: 1;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            min-width: 100px;
        }
        #container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #container canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }
        #error-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            max-height: 30%;
            overflow-y: auto;
            display: none;
            z-index: 100;
        }
        .btn {
            background-color: transparent;
            color: #cccccc;
            border: none;
            padding: 4px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            transition: background-color 0.1s, color 0.1s;
        }
        .btn:hover {
            background-color: #3c3c3c;
            color: white;
        }
        .btn:active {
            background-color: #444;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background-color: transparent;
        }
        .btn svg {
            width: 18px;
            height: 18px;
            pointer-events: none;
        }
        #file-input {
            display: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="toolbar">
            <button id="play-pause-btn" class="btn" title="Play/Pause">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </button>
            <div style="width: 1px; height: 16px; background: #444; margin: 0 2px;"></div>
            <button id="load-btn" class="btn" title="Load Script">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            </button>
            <input type="file" id="file-input" accept=".js,.ts,.txt">
            <button id="export-btn" class="btn" title="Export Video">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </button>
            <div style="width: 1px; height: 16px; background: #444; margin: 0 2px;"></div>
            <button id="toggle-editor-btn" class="btn" title="Toggle Editor">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
            </button>
            <div id="status" style="margin-left: auto; font-size: 11px; color: #888; padding-right: 5px;">Ready</div>
        </div>
        <div id="main-container">
            <div id="editor-container"></div>
            <div id="resizer"></div>
            <div id="render-container">
                <div id="container" style="width: 100%; height: 100%;"></div>
                <div id="error-overlay"></div>
            </div>
        </div>
    </div>
    <script type="module" src="/main.ts"></script>
</body>
</html>
